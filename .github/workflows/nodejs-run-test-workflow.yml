---
name: nodejs-run-test-workflow
on: push
jobs:
  run-test-nodejs-app:
    runs-on: ubuntu-slim
    steps:
      - name: getting my code first
        uses: actions/checkout@v6
      - name: installing node
        uses: actions/setup-node@v6
        with:
          node-version: '22.15.1'
      - name: Installing dependencies
        run: npm install
      - name: Testing App
        run: npm test 
      
